; ============================================================
; WedPix — PHP limits for photo/video uploads
; Applies to /api and subfolders on PHP-FPM / FastCGI / CGI hosts.
; (mod_php hosts read the php_value block in the site .htaccess instead.)
; Note: .user.ini changes can take up to a few minutes to apply
; (user_ini.cache_ttl, default 300s) or require a PHP-FPM reload.
; ============================================================

upload_max_filesize = 512M
post_max_size = 520M
max_file_uploads = 20
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
